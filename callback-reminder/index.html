<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Callback Reminder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9ff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(61,66,212,0.10);
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 96px; height: 96px;
      border-radius: 22px;
      background: linear-gradient(135deg, #7B80FF, #3D42D4);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 48px;
    }
    h1 { font-size: 1.6rem; margin-bottom: 12px; color: #1a1a1a; }
    p  { color: #555; line-height: 1.6; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: #f0f4ff;
      color: #3D42D4;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 32px;
    }
    .links { border-top: 1px solid #eee; padding-top: 24px; margin-top: 8px; }
    .links a {
      color: #3D42D4;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .links a:hover { text-decoration: underline; }
    .dev { margin-top: 32px; color: #999; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📞</div>
    <h1>Callback Reminder</h1>
    <p>Never forget to call back. Callback Reminder detects missed calls and schedules a Google Calendar reminder so you always follow up.</p>
    <div class="badge">Available on Android</div>
    <div class="links">
      <a href="privacy-policy.html">Privacy Policy</a>
    </div>
    <div class="dev">Developer: Nexa Labs &nbsp;·&nbsp; <a href="mailto:support.nexalabs@gmail.com" style="color:#999">support.nexalabs@gmail.com</a></div>
  </div>
</body>
</html>
